name: ARIEX4OPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariex4ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Repository quality gate
        run: ./scripts/lint.sh

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t ariex4ops-dashboard:${{ github.sha }} .
      - name: Run container
        run: docker run -d --name ariex4ops-dashboard -p 8080:80 ariex4ops-dashboard:${{ github.sha }}
      - name: Health check
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs ariex4ops-dashboard
          exit 1
      - name: Container cleanup
        if: always()
        run: |
          if docker container inspect ariex4ops-dashboard >/dev/null 2>&1; then
            docker rm -f ariex4ops-dashboard
          fi

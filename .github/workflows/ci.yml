name: ARIEX4OPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariex4ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
      - name: Shell syntax validation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if (("${#scripts[@]}" == 0)); then
            echo "No shell scripts found under scripts/"
            exit 1
          fi
          for script in "${scripts[@]}"; do bash -n "$script"; done
      - name: Repository quality gate
        shell: bash
        run: bash scripts/lint.sh

  docker:
    name: Docker build and Compose smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate effective Nginx configuration
        run: docker compose run --rm --no-deps --entrypoint nginx dashboard -t
      - name: Start hardened Compose service
        run: docker compose up --build -d
      - name: Health check
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Container cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Deploy Cloudflare Workers
        if: ${{ hashFiles('workers/**/wrangler.toml') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' config; do
            echo "Deploying Worker: $(dirname "$config")"
            npx --yes wrangler@4 deploy --config "$config"
          done < <(find workers -type f -name wrangler.toml -print0)
      - name: Deploy Cloudflare Pages
        if: ${{ hashFiles('pages/**') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project list > /tmp/arise-v9-pages-projects.txt
          if grep -Eq '(^|[^[:alnum:]_-])arise-v9([^[:alnum:]_-]|$)' /tmp/arise-v9-pages-projects.txt; then
            echo "Exact Pages project arise-v9 already exists"
          else
            echo "Creating Pages project arise-v9"
            npx --yes wrangler@4 pages project create arise-v9 --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy pages --project-name=arise-v9

name: ARIEX4OPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # No deployments: write — neither Wrangler nor repo steps create GitHub Deployments.

concurrency:
  group: ariex4ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Shell syntax validation
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found under scripts/"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Repository quality gate
        shell: bash
        run: bash scripts/lint.sh

  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy Cloudflare Workers
        if: ${{ hashFiles('workers/**/wrangler.toml') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          # Recursively discover every real wrangler.toml under workers/
          while IFS= read -r -d '' config; do
            echo "Deploying Worker: $(dirname "$config")"
            npx --yes wrangler@4 deploy --config "$config"
          done < <(find workers -type f -name wrangler.toml -print0)

      - name: Deploy Cloudflare Pages
        if: ${{ hashFiles('pages/**') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          # Idempotent project ensure + deploy.
          # Create the Pages project if it does not yet exist, then deploy.
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -q 'arise-v9'; then
            echo "Creating Pages project arise-v9"
            npx --yes wrangler@4 pages project create arise-v9 --production-branch=main || true
          fi
          npx --yes wrangler@4 pages deploy pages --project-name=arise-v9

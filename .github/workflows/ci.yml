name: ARIEX4OPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # No deployments: write — neither Wrangler nor repo steps create GitHub Deployments.

concurrency:
  group: ariex4ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Shell syntax validation
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found under scripts/"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Repository quality gate
        shell: bash
        run: bash scripts/lint.sh

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build image
        run: docker build --pull -t ariex4ops-dashboard:${{ github.sha }} .
      - name: Run container (hardened flags matching docker-compose baseline)
        run: >
          docker run -d --name ariex4ops-dashboard
          --read-only
          --cap-drop=ALL
          --security-opt no-new-privileges:true
          -p 8080:80
          ariex4ops-dashboard:${{ github.sha }}
      - name: Health check
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs ariex4ops-dashboard
          exit 1
      - name: Container cleanup
        if: always()
        run: |
          if docker container inspect ariex4ops-dashboard >/dev/null 2>&1; then
            docker rm -f ariex4ops-dashboard
          fi

  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy Cloudflare Workers
        if: ${{ hashFiles('workers/**/wrangler.toml') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          while IFS= read -r -d '' config; do
            echo "Deploying Worker: $(dirname "$config")"
            npx --yes wrangler@4 deploy --config "$config"
          done < <(find workers -type f -name wrangler.toml -print0)

      - name: Deploy Cloudflare Pages
        if: ${{ hashFiles('pages/**') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -q 'arise-v9'; then
            echo "Creating Pages project arise-v9"
            npx --yes wrangler@4 pages project create arise-v9 --production-branch=main || true
          fi
          npx --yes wrangler@4 pages deploy pages --project-name=arise-v9
